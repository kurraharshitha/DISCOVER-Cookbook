<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
    }

    h1 {
      font-size: 80px;
      color: #2e7d32;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      margin: 6px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .home {
      background: #2e7d32;
      color: white;
    }

    .home:hover {
      background: #256628;
    }

    .projects {
      border: 2px solid #2e7d32;
      color: #2e7d32;
    }

    .projects:hover {
      background: #e8f5e9;
    }

    @media(max-width:600px){
      h1{font-size:60px;}
      h2{font-size:22px;}
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops! Page not found</h2>
    <p>
      The page you are looking for doesn't exist or has been moved.
      Let's get you back to the DISCOVER Cookbook.
    </p>

    <a href="/" class="btn home">Go Home</a>
    <a href="/intro.html" class="btn projects">Start Reading</a>
  </div>
</body>
</html>
